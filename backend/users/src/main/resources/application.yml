spring:
  application:
    name: users

  datasource:
    url: ${USERS_DB_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${USERS_DB_USER:users_user}
    password: ${USERS_DB_PASSWORD:users_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      properties:
        enable.idempotence: true
        acks: all

    listener:
      ack-mode: record

    consumer:
      group-id: dummy-commerce.users.v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:ZHVtbXktY29tbWVyY2UtZGV2LWp3dC1zZWNyZXQtMzJiIQ==}
    access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}

  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
    send-timeout-ms: ${OUTBOX_PUBLISHER_SEND_TIMEOUT_MS:10000}
    retry-delay-ms: ${OUTBOX_PUBLISHER_RETRY_DELAY_MS:5000}

messaging:
  kafka:
    retry:
      max-retries: ${KAFKA_MAX_RETRIES:3}
      backoff-ms: ${KAFKA_RETRY_BACKOFF_MS:1000}
  retention:
    enabled: ${MESSAGING_RETENTION_ENABLED:true}
    fixed-delay-ms: ${MESSAGING_RETENTION_FIXED_DELAY_MS:43200000}
    outbox-days: ${OUTBOX_RETENTION_DAYS:30}
    inbox-days: ${INBOX_RETENTION_DAYS:90}
    batch-size: ${MESSAGING_RETENTION_BATCH_SIZE:1000}


server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
