spring:

  application:
    name: store

  datasource:
    url: ${STORE_DB_URL:jdbc:postgresql://localhost:5432/store_db}
    username: ${STORE_DB_USER:store_user}
    password: ${STORE_DB_PASSWORD:store_password}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket: ${MINIO_BUCKET:product-images}
    upload-url-expiration-seconds: 900

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html