spring:

  application:
    name: store

  datasource:
    url: ${STORE_DB_URL:jdbc:postgresql://localhost:5432/store_db}
    username: ${STORE_DB_USER:store_user}
    password: ${STORE_DB_PASSWORD:store_password}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    region: ${MINIO_REGION:us-east-1}
    bucket: ${MINIO_BUCKET:product-images}
    upload-url-expiration-seconds: 900

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:ZHVtbXktY29tbWVyY2UtZGV2LWp3dC1zZWNyZXQtMzJiIQ==}

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
