services:

  postgres:
    image: postgres:17-alpine
    container_name: dummy-commerce-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dummy-commerce-minio

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10


  store:
    build:
      context: ./backend/store
      dockerfile: Dockerfile

    container_name: dummy-commerce-store

    environment:
      STORE_DB_URL: jdbc:postgresql://postgres:5432/store_db
      STORE_DB_USER: store_user
      STORE_DB_PASSWORD: store_password

      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: product-images

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy


  users:
    build:
      context: ./backend/users
      dockerfile: Dockerfile

    container_name: dummy-commerce-users

    environment:
      USERS_DB_URL: jdbc:postgresql://postgres:5432/users_db
      USERS_DB_USER: users_user
      USERS_DB_PASSWORD: users_password

      JWT_SECRET: ZHVtbXktY29tbWVyY2UtZGV2LWp3dC1zZWNyZXQtMzJiIQ==
      JWT_ACCESS_EXPIRATION_SECONDS: 900
      REFRESH_TOKEN_EXPIRATION_SECONDS: 2592000

    ports:
      - "8081:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
  minio_data: